<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="web_standard" name="shell-type"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
@layer base {
  html, body { margin: 0; padding: 0; background-color: #F8FAFC; font-family: 'Inter', sans-serif; color: #0F172A; }
  body { overscroll-behavior: none; }
  main > :first-child { margin-top: 0 !important; }
  main > :last-child { margin-bottom: 0 !important; }
}
::-webkit-scrollbar { display: none; }
</style>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        'primary-600': '#4F46E5',
        'primary-700': '#4338CA',
        'primary-100': '#E0E7FF',
        'primary-50': '#EEF2FF',
        'neutral-0': '#FFFFFF',
        'neutral-50': '#F8FAFC',
        'neutral-100': '#F1F5F9',
        'neutral-200': '#E2E8F0',
        'neutral-300': '#CBD5E1',
        'neutral-500': '#64748B',
        'neutral-700': '#334155',
        'neutral-900': '#0F172A',
        'danger-600': '#DC2626'
      }
    }
  }
}
</script>
<style>html, body { min-height: 1024px; }</style>
</head>
<body class="bg-[#F8FAFC] antialiased">
<header class="fixed top-0 left-0 w-full z-50 bg-white border-b border-[#E2E8F0]">
  <div class="h-16 max-w-[1200px] mx-auto px-8 flex items-center justify-between">
    <div class="flex items-center gap-8">
      <a class="text-[20px] leading-[28px] font-bold text-[#4F46E5] tracking-tight" href="#">SkillShare</a>
      <nav class="hidden md:flex items-center gap-6">
        <a class="text-[14px] leading-[20px] font-medium text-[#334155] hover:text-[#0F172A] transition-colors" href="#">Dashboard</a>
        <a class="text-[14px] leading-[20px] font-medium text-[#4F46E5] border-b-2 border-[#4F46E5] py-5" href="#">Catalogue</a>
        <a class="text-[14px] leading-[20px] font-medium text-[#334155] hover:text-[#0F172A] transition-colors" href="#">Requests</a>
        <a class="text-[14px] leading-[20px] font-medium text-[#334155] hover:text-[#0F172A] transition-colors" href="#">Proposals</a>
        <a class="text-[14px] leading-[20px] font-medium text-[#334155] hover:text-[#0F172A] transition-colors" href="#">Reports</a>
      </nav>
    </div>
    <div class="flex items-center gap-3">
      <button aria-label="Notifications" class="relative w-10 h-10 text-[#64748B] hover:text-[#0F172A] transition-colors flex items-center justify-center" type="button">
        <span class="material-symbols-outlined text-[20px]">notifications</span>
        <span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-[#DC2626]"></span>
      </button>
      <button class="flex items-center gap-1 px-3 py-2 text-[14px] leading-[20px] font-medium text-[#64748B] hover:bg-[#F1F5F9] hover:text-[#0F172A] rounded-lg transition-colors" type="button">
        <span>Account</span>
        <span class="material-symbols-outlined text-[18px]">expand_more</span>
      </button>
    </div>
  </div>
</header>

<main class="w-full pt-16 bg-[#F8FAFC] min-h-[calc(100vh-64px)]">
  <div class="w-full max-w-[1200px] mx-auto px-8 pt-8 pb-12">
    <!-- Back Link (A7) -->
    <div class="mb-4">
      <a class="inline-flex items-center gap-1 text-[#4F46E5] hover:text-[#4338CA] text-[14px] leading-[20px] font-medium transition-colors" href="#">
        <span class="material-symbols-outlined text-[20px]">arrow_back</span>
        <span>Catalogue</span>
      </a>
    </div>

    <!-- Header Section -->
    <div class="flex flex-col gap-2 mb-8">
      <!-- H1 skeleton bar: 32px tall, 200px wide -->
      <div class="h-8 w-[200px] bg-[#E2E8F0] rounded"></div>
      <!-- Category metadata row -->
      <div class="flex items-center gap-2">
        <span class="text-[12px] leading-[16px] uppercase tracking-[0.04em] text-[#64748B] font-medium">Category</span>
        <div class="h-[14px] w-[140px] bg-[#E2E8F0] rounded"></div>
      </div>
    </div>

    <!-- Content Section -->
    <section class="mt-8">
      <h2 class="text-[22px] leading-[30px] font-semibold text-[#0F172A] mb-4">Students who can teach this</h2>

      <!-- Table Card -->
      <div class="bg-white border border-[#E2E8F0] rounded-xl overflow-hidden shadow-[0_1px_2px_rgba(15,23,42,0.06)]">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="h-[44px] bg-[#F1F5F9] text-[#64748B] text-[12px] leading-[16px] uppercase tracking-[0.04em] font-medium select-none">
              <th class="px-4" scope="col">Name</th>
              <th class="px-4" scope="col">Department</th>
              <th class="px-4" scope="col">Year</th>
              <th class="px-4" scope="col">Average rating</th>
              <th class="px-4" scope="col">Feedback</th>
              <th class="px-4 text-right" scope="col"><span class="sr-only">Actions</span></th>
            </tr>
          </thead>
          <tbody class="divide-y divide-[#E2E8F0] text-[14px] leading-[20px]">
            <!-- Row 1 -->
            <tr class="h-[56px] hover:bg-[#F8FAFC] transition-colors">
              <td class="px-4 align-middle whitespace-nowrap">
                <div class="h-[14px] w-[200px] bg-[#E0E7FF] rounded cursor-pointer"></div>
              </td>
              <td class="px-4 align-middle whitespace-nowrap">
                <div class="h-[14px] w-[140px] bg-[#E2E8F0] rounded"></div>
              </td>
              <td class="px-4 align-middle whitespace-nowrap">
                <div class="h-[14px] w-[80px] bg-[#E2E8F0] rounded"></div>
              </td>
              <td class="px-4 align-middle whitespace-nowrap">
                <div class="flex items-center gap-1.5">
                  <div class="flex items-center text-[#CBD5E1]">
                    <span class="material-symbols-outlined text-[20px]">star</span>
                    <span class="material-symbols-outlined text-[20px]">star</span>
                    <span class="material-symbols-outlined text-[20px]">star</span>
                    <span class="material-symbols-outlined text-[20px]">star</span>
                    <span class="material-symbols-outlined text-[20px]">star</span>
                  </div>
                  <div class="h-[14px] w-[40px] bg-[#E2E8F0] rounded"></div>
                </div>
              </td>
              <td class="px-4 align-middle whitespace-nowrap">
                <div class="h-[14px] w-[80px] bg-[#E2E8F0] rounded"></div>
              </td>
              <td class="px-4 align-middle text-right whitespace-nowrap">
                <button class="h-8 px-3 bg-[#4F46E5] hover:bg-[#4338CA] text-white text-[14px] leading-[20px] font-medium rounded-lg transition-colors" type="button">Request this skill</button>
              </td>
            </tr>
            <!-- Row 2 -->
            <tr class="h-[56px] hover:bg-[#F8FAFC] transition-colors">
              <td class="px-4 align-middle whitespace-nowrap">
                <div class="h-[14px] w-[200px] bg-[#E0E7FF] rounded cursor-pointer"></div>
              </td>
              <td class="px-4 align-middle whitespace-nowrap">
                <div class="h-[14px] w-[140px] bg-[#E2E8F0] rounded"></div>
              </td>
              <td class="px-4 align-middle whitespace-nowrap">
                <div class="h-[14px] w-[80px] bg-[#E2E8F0] rounded"></div>
              </td>
              <td class="px-4 align-middle whitespace-nowrap">
                <div class="flex items-center gap-1.5">
                  <div class="flex items-center text-[#CBD5E1]">
                    <span class="material-symbols-outlined text-[20px]">star</span>
                    <span class="material-symbols-outlined text-[20px]">star</span>
                    <span class="material-symbols-outlined text-[20px]">star</span>
                    <span class="material-symbols-outlined text-[20px]">star</span>
                    <span class="material-symbols-outlined text-[20px]">star</span>
                  </div>
                  <div class="h-[14px] w-[40px] bg-[#E2E8F0] rounded"></div>
                </div>
              </td>
              <td class="px-4 align-middle whitespace-nowrap">
                <div class="h-[14px] w-[80px] bg-[#E2E8F0] rounded"></div>
              </td>
              <td class="px-4 align-middle text-right whitespace-nowrap">
                <button class="h-8 px-3 bg-[#4F46E5] hover:bg-[#4338CA] text-white text-[14px] leading-[20px] font-medium rounded-lg transition-colors" type="button">Request this skill</button>
              </td>
            </tr>
            <!-- Row 3 -->
            <tr class="h-[56px] hover:bg-[#F8FAFC] transition-colors">
              <td class="px-4 align-middle whitespace-nowrap">
                <div class="h-[14px] w-[200px] bg-[#E0E7FF] rounded cursor-pointer"></div>
              </td>
              <td class="px-4 align-middle whitespace-nowrap">
                <div class="h-[14px] w-[140px] bg-[#E2E8F0] rounded"></div>
              </td>
              <td class="px-4 align-middle whitespace-nowrap">
                <div class="h-[14px] w-[80px] bg-[#E2E8F0] rounded"></div>
              </td>
              <td class="px-4 align-middle whitespace-nowrap">
                <div class="flex items-center gap-1.5">
                  <div class="flex items-center text-[#CBD5E1]">
                    <span class="material-symbols-outlined text-[20px]">star</span>
                    <span class="material-symbols-outlined text-[20px]">star</span>
                    <span class="material-symbols-outlined text-[20px]">star</span>
                    <span class="material-symbols-outlined text-[20px]">star</span>
                    <span class="material-symbols-outlined text-[20px]">star</span>
                  </div>
                  <div class="h-[14px] w-[40px] bg-[#E2E8F0] rounded"></div>
                </div>
              </td>
              <td class="px-4 align-middle whitespace-nowrap">
                <div class="h-[14px] w-[80px] bg-[#E2E8F0] rounded"></div>
              </td>
              <td class="px-4 align-middle text-right whitespace-nowrap">
                <button class="h-8 px-3 bg-[#4F46E5] hover:bg-[#4338CA] text-white text-[14px] leading-[20px] font-medium rounded-lg transition-colors" type="button">Request this skill</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>
</main>
</body>
</html>
