 "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, "spacing": { "space-2xl": "48px", "margin-wide": "32px", "margin": "24px", "gutter-wide": "24px", "space-xl": "32px", "gutter": "16px", "space-2xs": "4px", "space-lg": "24px", "space-md": "16px", "space-sm": "12px", "space-xs": "8px" }, "fontFamily": { "label-xs": ["Inter"], "headline-sm": ["Inter"], "body-sm": ["Inter"], "body-md": ["Inter"], "headline-md": ["Inter"], "code-md": ["JetBrains Mono"], "display-lg": ["Inter"], "body-lg": ["Inter"], "label-sm": ["Inter"], "code-sm": ["JetBrains Mono"], "headline-lg": ["Inter"], "label-md": ["Inter"] }, "fontSize": { "label-xs": ["11px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "600" }], "headline-sm": ["16px", { "lineHeight": "24px", "letterSpacing": "-0.005em", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.005em", "fontWeight": "400" }], "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "code-md": ["13px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }], "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400" }], "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500" }], "code-sm": ["11px", { "lineHeight": "16px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "500" }] } } } };</script></head><body class="bg-surface min-h-screen font-body-md text-body-md text-on-surface antialiased"><div class="min-h-[1024px] w-full flex items-center justify-center p-margin bg-inverse-surface/50 backdrop-blur-sm"><main class="w-full max-w-[1440px] flex items-center justify-center"><div class="flex flex-col w-full items-center justify-center min-h-[640px] relative py-space-2xl">
<!-- Subtle decorative ambient elements behind the focused overlay interaction -->
<div class="absolute -top-12 -left-12 w-96 h-96 bg-primary-fixed/30 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-12 -right-12 w-96 h-96 bg-surface-container/60 rounded-full blur-3xl pointer-events-none"></div>
<!-- Modal Dialog Window Container: 400px width, 16px radius (rounded-xl), 24px padding (p-space-lg) -->
<div aria-describedby="dialog-desc" aria-labelledby="dialog-title" aria-modal="true" class="relative z-10 w-[400px] bg-surface-container-lowest rounded-xl p-space-lg shadow-[0_12px_32px_rgba(15,23,42,0.18)] transition-all duration-200" id="decline-dialog" role="dialog">
<!-- Header Row -->
<div class="flex items-start justify-between gap-space-sm mb-space-xs">
<div class="flex items-center gap-space-xs">
<div class="w-8 h-8 rounded-lg bg-error-container/40 flex items-center justify-center text-error flex-shrink-0">
<span class="material-symbols-outlined text-[18px]">event_busy</span>
</div>
<h3 class="font-headline-sm text-headline-sm text-on-surface" id="dialog-title">
          Decline this slot?
        </h3>
</div>
<button aria-label="Close dialog" class="text-secondary hover:text-on-surface transition-colors p-space-2xs -mr-1 -mt-1 rounded focus:outline-none focus:ring-2 focus:ring-primary/20 flex items-center justify-center cursor-pointer" id="btn-close-icon" type="button">
<span class="material-symbols-outlined text-[20px] leading-none">close</span>
</button>
</div>
<!-- Description -->
<div class="pl-10">
<p class="font-body-md text-body-md text-secondary" id="dialog-desc">
        The request will be closed.
      </p>
<!-- Slot Metadata Snippet for instructional clarity and high visual finish -->
<div class="mt-space-md p-space-sm bg-surface-container-low rounded-lg flex flex-col gap-space-2xs">
<div class="flex items-center justify-between">
<span class="font-label-xs text-label-xs text-on-surface-variant uppercase tracking-wider">Scheduled Session</span>
<span class="inline-flex items-center gap-1 font-label-xs text-label-xs text-error font-semibold bg-error-container/40 px-2 py-0.5 rounded">
            Pending
          </span>
</div>
<div class="flex items-center gap-space-xs mt-1">
<span class="material-symbols-outlined text-secondary text-[16px]">calendar_today</span>
<span class="font-code-sm text-code-sm text-on-surface">Oct 24, 2024 · 14:00 - 15:00 UTC</span>
</div>
</div>
</div>
<!-- 24px Gap to Footer Row -->
<div class="h-space-lg"></div>
<!-- Footer Row: right-aligned with 8px gap -->
<div class="flex items-center justify-end gap-space-xs">
<!-- Secondary Button: Cancel -->
<button class="h-10 px-space-md rounded-xl bg-surface-container-lowest text-on-surface font-label-md text-label-md shadow-sm hover:bg-surface-container-low active:bg-surface-container transition-all cursor-pointer flex items-center justify-center focus:outline-none" id="btn-cancel" type="button">
        Cancel
      </button>
<!-- Danger Button: Decline slot -->
<button class="h-10 px-space-md rounded-xl bg-tertiary-container hover:bg-tertiary text-on-error font-label-md text-label-md transition-all shadow-sm active:scale-[0.98] cursor-pointer flex items-center justify-center focus:outline-none" id="btn-confirm-decline" type="button">
        Decline slot
      </button>
</div>
</div>
</div>
<script>
  (function() {
    const dialog = document.getElementById('decline-dialog');
    const closeBtn = document.getElementById('btn-close-icon');
    const cancelBtn = document.getElementById('btn-cancel');
    const declineBtn = document.getElementById('btn-confirm-decline');

    function dismiss(action) {
      if (!dialog) return;
      dialog.style.transform = 'scale(0.96)';
      dialog.style.opacity = '0';
      setTimeout(() => {
        dialog.parentElement.innerHTML = `
          <div class="p-space-lg bg-surface-container-lowest rounded-xl shadow-md text-center max-w-sm">
            <div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center mx-auto mb-space-sm text-secondary">
              <span class="material-symbols-outlined text-[20px]">check_circle</span>
            </div>
            <p class="font-headline-sm text-headline-sm text-on-surface">Dialog ${action}</p>
            <p class="font-body-sm text-body-sm text-secondary mt-1">The slot status transition was triggered successfully.</p>
          </div>
        `;
      }, 200);
    }

    if (closeBtn) closeBtn.addEventListener('click', () => dismiss('Closed'));
    if (cancelBtn) cancelBtn.addEventListener('click', () => dismiss('Cancelled'));
    if (declineBtn) {
      declineBtn.addEventListener('click', () => {
        declineBtn.textContent = 'Declining...';
        declineBtn.classList.add('opacity-75', 'pointer-events-none');
        setTimeout(() => dismiss('Declined'), 500);
      });
    }
  })();
</script></main></div></body></html>
