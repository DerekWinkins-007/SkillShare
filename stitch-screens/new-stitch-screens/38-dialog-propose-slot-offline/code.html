<!DOCTYPE html>

<html class="h-full" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base { html, body { margin: 0; padding: 0; } body { overscroll-behavior: none; } main > :first-child { margin-top: 0 !important; } main > :last-child { margin-bottom: 0 !important; } } ::-webkit-scrollbar { display: none; }</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-variant": "#dae2fd", "on-surface-variant": "#464555", "inverse-on-surface": "#eef0ff", "on-secondary-container": "#54647a", "primary-container": "#4f46e5", "surface-container": "#eaedff", "tertiary-fixed-dim": "#ffb4ab", "background": "#faf8ff", "surface-container-lowest": "#ffffff", "tertiary-fixed": "#ffdad6", "secondary": "#505f76", "on-secondary-fixed-variant": "#38485d", "tertiary": "#97000c", "error-container": "#ffdad6", "on-secondary-fixed": "#0b1c30", "on-tertiary-fixed": "#410002", "secondary-fixed-dim": "#b7c8e1", "on-tertiary-container": "#ffd1cc", "surface-tint": "#4d44e3", "on-primary-fixed": "#0f0069", "on-tertiary-fixed-variant": "#93000b", "surface-dim": "#d2d9f4", "on-error-container": "#93000a", "surface-container-high": "#e2e7ff", "secondary-fixed": "#d3e4fe", "tertiary-container": "#c20b17", "inverse-primary": "#c3c0ff", "error": "#ba1a1a", "on-secondary": "#ffffff", "primary-fixed": "#e2dfff", "primary-fixed-dim": "#c3c0ff", "on-surface": "#131b2e", "on-tertiary": "#ffffff", "surface-bright": "#faf8ff", "primary": "#3525cd", "inverse-surface": "#283044", "surface": "#faf8ff", "on-primary": "#ffffff", "surface-container-low": "#f2f3ff", "outline": "#777587", "surface-container-highest": "#dae2fd", "secondary-container": "#d0e1fb", "on-error": "#ffffff", "on-primary-container": "#dad7ff", "on-background": "#131b2e", "outline-variant": "#c7c4d8", "on-primary-fixed-variant": "#3323cc" }, "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, "spacing": { "space-2xl": "48px", "margin-wide": "32px", "margin": "24px", "gutter-wide": "24px", "space-xl": "32px", "gutter": "16px", "space-2xs": "4px", "space-lg": "24px", "space-md": "16px", "space-sm": "12px", "space-xs": "8px" }, "fontFamily": { "label-xs": ["Inter"], "headline-sm": ["Inter"], "body-sm": ["Inter"], "body-md": ["Inter"], "headline-md": ["Inter"], "code-md": ["JetBrains Mono"], "display-lg": ["Inter"], "body-lg": ["Inter"], "label-sm": ["Inter"], "code-sm": ["JetBrains Mono"], "headline-lg": ["Inter"], "label-md": ["Inter"] }, "fontSize": { "label-xs": ["11px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "600" }], "headline-sm": ["16px", { "lineHeight": "24px", "letterSpacing": "-0.005em", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.005em", "fontWeight": "400" }], "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "code-md": ["13px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }], "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400" }], "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500" }], "code-sm": ["11px", { "lineHeight": "16px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "500" }] } } } };</script></head><body class="bg-surface min-h-screen font-body-md text-body-md text-on-surface antialiased"><div class="min-h-[1024px] w-full flex items-center justify-center p-margin bg-inverse-surface/50 backdrop-blur-sm"><main class="w-full max-w-[1440px] flex items-center justify-center"><div class="flex flex-col w-full items-center justify-center min-h-[720px] p-margin">
<!-- Backdrop Canvas Simulation with Centered Modal Card -->
<div class="relative w-full max-w-[480px] bg-surface-container-lowest rounded-xl shadow-xl p-space-lg flex flex-col gap-space-md">
<!-- Header -->
<div class="flex items-center justify-between pb-space-xs">
<div class="flex items-center gap-space-xs">
<span class="material-symbols-outlined text-primary text-[20px]" style="font-variation-settings: 'FILL' 1;">calendar_add_on</span>
<h3 class="font-headline-md text-headline-md text-on-surface">Propose a slot</h3>
</div>
<button aria-label="Close dialog" class="w-8 h-8 rounded flex items-center justify-center text-on-surface-variant hover:bg-surface-container transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Form Body -->
<form class="flex flex-col gap-space-md" onsubmit="event.preventDefault();">
<!-- Field 1: Date and time -->
<div class="flex flex-col gap-space-2xs">
<label class="font-label-md text-label-md text-secondary flex items-center gap-1" for="slot-datetime">
          Date and time <span class="text-error font-body-md">*</span>
</label>
<div class="relative flex items-center">
<input class="w-full h-10 px-space-sm bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded placeholder:text-outline focus:outline-none focus:bg-surface-container-low transition-all" id="slot-datetime" placeholder="Select date and time" type="datetime-local"/>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">
          Must be at least 2 hours from now.
        </p>
</div>
<!-- Field 2: Duration -->
<div class="flex flex-col gap-space-2xs">
<label class="font-label-md text-label-md text-secondary flex items-center gap-1" for="slot-duration">
          Duration <span class="text-error font-body-md">*</span>
</label>
<div class="relative flex items-center">
<select class="w-full h-10 px-space-sm pr-9 bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded appearance-none focus:outline-none focus:bg-surface-container-low transition-all cursor-pointer" id="slot-duration">
<option value="60">60 minutes</option>
<option value="30">30 minutes</option>
<option value="45">45 minutes</option>
<option value="90">90 minutes</option>
<option value="120">120 minutes</option>
</select>
<span class="material-symbols-outlined pointer-events-none absolute right-3 text-secondary text-[20px]">
            expand_more
          </span>
</div>
</div>
<!-- Field 3: Mode -->
<div class="flex flex-col gap-space-2xs">
<span class="font-label-md text-label-md text-secondary flex items-center gap-1">
          Mode <span class="text-error font-body-md">*</span>
</span>
<div class="flex items-center gap-space-lg pt-1">
<!-- Radio Option: Online -->
<label class="flex items-center gap-space-xs cursor-pointer select-none group">
<input class="sr-only peer" id="mode-online" name="session_mode" type="radio" value="online"/>
<div class="w-4 h-4 rounded-full bg-surface-container-lowest peer-checked:bg-primary-container flex items-center justify-center transition-all shadow-sm">
<div class="w-2 h-2 rounded-full bg-surface-container-lowest hidden peer-checked:block"></div>
</div>
<span class="font-body-md text-body-md text-secondary group-hover:text-on-surface transition-colors">Online</span>
</label>
<!-- Radio Option: Offline (Selected) -->
<label class="flex items-center gap-space-xs cursor-pointer select-none group">
<input checked="" class="sr-only peer" id="mode-offline" name="session_mode" type="radio" value="offline"/>
<div class="w-4 h-4 rounded-full bg-primary-container flex items-center justify-center transition-all shadow-sm">
<div class="w-2 h-2 rounded-full bg-surface-container-lowest block"></div>
</div>
<span class="font-body-md text-body-md text-on-surface font-medium transition-colors">Offline</span>
</label>
</div>
</div>
<!-- Field 4: Location -->
<div class="flex flex-col gap-space-2xs">
<label class="font-label-md text-label-md text-secondary flex items-center gap-1" for="slot-location">
          Location <span class="text-error font-body-md">*</span>
</label>
<div class="relative flex items-center">
<input class="w-full h-10 px-space-sm bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded placeholder:text-outline focus:outline-none focus:bg-surface-container-low transition-all" id="slot-location" maxlength="150" oninput="document.getElementById('location-counter').textContent = `${this.value.length}/150`" placeholder="e.g. Building 4, Studio Hub or Room 204" type="text"/>
</div>
<div class="flex justify-end pt-0.5">
<span class="font-label-xs text-label-xs text-on-surface-variant font-code-sm" id="location-counter">0/150</span>
</div>
</div>
<!-- Footer Buttons -->
<div class="flex items-center justify-end gap-space-xs pt-space-xs mt-space-2xs">
<button class="h-10 px-space-md rounded bg-surface-container-lowest text-on-surface font-label-md text-label-md hover:bg-surface-container-low active:bg-surface-container transition-all flex items-center justify-center" type="button">
          Cancel
        </button>
<button class="h-10 px-space-md rounded bg-primary-container text-on-primary font-label-md text-label-md hover:opacity-90 active:scale-[0.99] transition-all flex items-center justify-center gap-space-2xs shadow-sm" type="submit">
<span class="material-symbols-outlined text-[18px]">send</span>
          Send proposal
        </button>
</div>
</form>
</div>
</div>
<script>
  // Dynamic radio button presentation sync
  document.querySelectorAll('input[name="session_mode"]').forEach((radio) => {
    radio.addEventListener('change', (e) => {
      document.querySelectorAll('input[name="session_mode"]').forEach((r) => {
        const visual = r.nextElementSibling;
        const label = visual.nextElementSibling;
        if (r.checked) {
          visual.className = 'w-4 h-4 rounded-full bg-primary-container flex items-center justify-center transition-all shadow-sm';
          visual.innerHTML = '<div class="w-2 h-2 rounded-full bg-surface-container-lowest block"></div>';
          label.className = 'font-body-md text-body-md text-on-surface font-medium transition-colors';
        } else {
          visual.className = 'w-4 h-4 rounded-full bg-surface-container-lowest flex items-center justify-center transition-all shadow-sm';
          visual.innerHTML = '<div class="w-2 h-2 rounded-full bg-surface-container-lowest hidden"></div>';
          label.className = 'font-body-md text-body-md text-secondary group-hover:text-on-surface transition-colors';
        }
      });
    });
  });
</script></main></div></body></html>
