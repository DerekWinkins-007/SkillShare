 "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, "spacing": { "space-2xl": "48px", "margin-wide": "32px", "margin": "24px", "gutter-wide": "24px", "space-xl": "32px", "gutter": "16px", "space-2xs": "4px", "space-lg": "24px", "space-md": "16px", "space-sm": "12px", "space-xs": "8px" }, "fontFamily": { "label-xs": ["Inter"], "headline-sm": ["Inter"], "body-sm": ["Inter"], "body-md": ["Inter"], "headline-md": ["Inter"], "code-md": ["JetBrains Mono"], "display-lg": ["Inter"], "body-lg": ["Inter"], "label-sm": ["Inter"], "code-sm": ["JetBrains Mono"], "headline-lg": ["Inter"], "label-md": ["Inter"] }, "fontSize": { "label-xs": ["11px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "600" }], "headline-sm": ["16px", { "lineHeight": "24px", "letterSpacing": "-0.005em", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.005em", "fontWeight": "400" }], "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "code-md": ["13px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }], "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400" }], "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500" }], "code-sm": ["11px", { "lineHeight": "16px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "500" }] } } } };</script></head><body class="bg-surface min-h-screen font-body-md text-body-md text-on-surface antialiased"><div class="min-h-[1024px] w-full flex items-center justify-center p-margin bg-inverse-surface/50 backdrop-blur-sm"><main class="w-full max-w-[1440px] flex items-center justify-center"><div class="flex flex-col w-full items-center justify-center min-h-[640px] relative select-none">
<!-- Subtle decorative ambient elements under dialog container -->
<div class="absolute inset-0 bg-inverse-surface/5 backdrop-blur-[2px] pointer-events-none rounded-xl"></div>
<!-- Confirmation Dialog (Width: 400px, White background, Radius: 16px/rounded-xl, Padding: 24px) -->
<div class="relative z-10 w-full max-w-[400px] bg-surface-container-lowest rounded-xl p-space-lg shadow-[0_12px_32px_rgba(15,23,42,0.18)] transition-all duration-200" id="delete-skill-dialog">
<!-- Header Row -->
<div class="flex items-start justify-between gap-space-sm">
<div class="flex items-center gap-space-xs">
<div class="w-8 h-8 rounded-lg bg-tertiary-fixed flex items-center justify-center text-tertiary flex-shrink-0">
<span class="material-symbols-outlined text-[18px]">warning</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface font-semibold tracking-tight">
          Delete this skill?
        </h3>
</div>
<button aria-label="Close dialog" class="text-secondary hover:text-on-surface hover:bg-surface-container-high transition-colors p-space-2xs rounded-lg flex items-center justify-center -mr-1 -mt-1 cursor-pointer focus:outline-none focus:ring-2 focus:ring-primary/20" id="btn-close-modal" type="button">
<span class="material-symbols-outlined text-[20px] leading-none">close</span>
</button>
</div>
<!-- Description -->
<div class="mt-space-sm pl-10">
<p class="font-body-md text-body-md text-secondary leading-5">
        A skill that has requests cannot be deleted.
      </p>
</div>
<!-- Wireframe metadata indicator block for extra context and visual density -->
<div class="mt-space-md ml-10 p-space-xs rounded-lg bg-surface-container-low flex items-center gap-space-xs text-secondary">
<span class="material-symbols-outlined text-[16px] text-outline">info</span>
<span class="font-code-sm text-code-sm text-on-surface-variant">ID: SKILL-0842 • Active in 0 tracks</span>
</div>
<!-- Footer Row (24px gap to footer, right-aligned, 8px gap) -->
<div class="mt-space-lg flex items-center justify-end gap-space-xs pt-space-xs">
<!-- Cancel (Secondary) Button -->
<button class="h-10 px-space-md rounded-xl bg-surface-container-lowest text-on-surface font-label-md text-label-md font-medium hover:bg-surface-container-low active:bg-surface-container transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-primary/20 cursor-pointer" id="btn-cancel" type="button">
        Cancel
      </button>
<!-- Delete skill (Danger) Button -->
<button class="h-10 px-space-md rounded-xl bg-tertiary-container hover:bg-tertiary text-on-tertiary font-label-md text-label-md font-medium shadow-sm transition-all focus:outline-none focus:ring-2 focus:ring-tertiary/30 cursor-pointer flex items-center gap-space-2xs" id="btn-confirm-delete" type="button">
<span class="material-symbols-outlined text-[18px]">delete</span>
<span>Delete skill</span>
</button>
</div>
</div>
<script>
    (function() {
      const dialog = document.getElementById('delete-skill-dialog');
      const closeBtn = document.getElementById('btn-close-modal');
      const cancelBtn = document.getElementById('btn-cancel');
      const deleteBtn = document.getElementById('btn-confirm-delete');

      function dismiss() {
        if (!dialog) return;
        dialog.style.opacity = '0';
        dialog.style.transform = 'scale(0.96)';
        setTimeout(() => {
          dialog.style.opacity = '1';
          dialog.style.transform = 'scale(1)';
        }, 1200);
      }

      function executeDelete() {
        if (!deleteBtn) return;
        const originalContent = deleteBtn.innerHTML;
        deleteBtn.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span><span>Deleting...</span>';
        deleteBtn.disabled = true;
        setTimeout(() => {
          deleteBtn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check</span><span>Deleted</span>';
          setTimeout(() => {
            deleteBtn.innerHTML = originalContent;
            deleteBtn.disabled = false;
            dismiss();
          }, 800);
        }, 700);
      }

      closeBtn?.addEventListener('click', dismiss);
      cancelBtn?.addEventListener('click', dismiss);
      deleteBtn?.addEventListener('click', executeDelete);
    })();
  </script>
</div></main></div></body></html>
