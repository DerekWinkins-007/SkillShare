margin flex items-center justify-between"><div class="flex items-center gap-space-xl h-full"><a class="text-[20px] leading-[28px] font-bold text-primary tracking-tight select-none" data-path="dashboard" href="#">SkillShare</a><nav class="flex items-center gap-space-lg h-full" data-active-classes="text-primary border-b-2 border-primary font-label-md"><a class="h-full flex items-center font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors" data-path="dashboard" href="#">Dashboard</a><a class="h-full flex items-center font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors" data-path="catalogue" href="#">Catalogue</a><a class="h-full flex items-center font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors" data-path="requests" href="#">Requests</a><a class="h-full flex items-center font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors" data-path="proposals" href="#">Proposals</a><a class="h-full flex items-center font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors" data-path="reports" href="#">Reports</a></nav></div><div class="flex items-center gap-space-md"><button aria-label="Notifications" class="relative flex items-center justify-center w-9 h-9 rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container-low transition-colors" type="button"><span class="material-symbols-outlined text-[20px]">notifications</span><span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-error ring-2 ring-surface-container-lowest"></span></button><button class="flex items-center gap-space-2xs px-space-sm h-9 rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container-low transition-colors font-label-md text-label-md" type="button"><span class="font-label-md text-label-md">Account</span><span class="material-symbols-outlined text-[18px]">expand_more</span></button><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="w-full pt-16 min-h-screen bg-background"><div class="flex flex-col w-full">
<div class="w-full bg-[#F8FAFC] pb-space-2xl min-h-[calc(100vh-4rem)]">
<div class="max-w-[1200px] mx-auto px-margin">
<!-- Back Link -->
<div class="pt-space-lg mb-space-md">
<a class="inline-flex items-center gap-space-2xs text-[#64748B] hover:text-[#0F172A] transition-colors group" href="/requests">
<span class="material-symbols-outlined text-[18px] transition-transform group-hover:-translate-x-0.5">arrow_back</span>
<span class="font-label-md text-label-md">Requests</span>
</a>
</div>
<!-- Header Row -->
<div class="flex items-center justify-between pb-space-xl">
<div class="flex items-center gap-space-md">
<!-- Skill Name H1 Skeleton -->
<div class="w-[200px] h-[32px] bg-[#E2E8F0] rounded-[4px] animate-pulse"></div>
<!-- Status Badge: Accepted -->
<span class="inline-flex items-center justify-center h-[24px] px-[10px] rounded-full bg-[#DBEAFE] text-[#1D4ED8] font-label-sm text-label-sm font-medium tracking-tight">
            Accepted
          </span>
</div>
</div>
<!-- Main Two-Column Layout -->
<div class="flex flex-col lg:flex-row items-start gap-[24px]">
<!-- Left Column: Fixed 720px on desktop -->
<div class="w-full lg:w-[720px] flex-shrink-0 flex flex-col gap-[24px]">
<!-- Card 1: Summary -->
<div class="bg-white rounded-[12px] p-[24px] shadow-[0_1px_2px_rgba(15,23,42,0.06)] border border-[#E2E8F0]">
<h3 class="font-headline-sm text-headline-sm text-[#0F172A] mb-[20px]">Summary</h3>
<div class="flex flex-col gap-[16px]">
<!-- Skill -->
<div class="flex items-center">
<span class="w-[160px] flex-shrink-0 text-[#64748B] font-label-sm text-label-sm">Skill</span>
<div class="w-[200px] h-[16px] bg-[#E2E8F0] rounded-[4px] animate-pulse"></div>
</div>
<!-- Category -->
<div class="flex items-center">
<span class="w-[160px] flex-shrink-0 text-[#64748B] font-label-sm text-label-sm">Category</span>
<div class="w-[140px] h-[16px] bg-[#E2E8F0] rounded-[4px] animate-pulse"></div>
</div>
<!-- Other person (Link-styled skeleton bar) -->
<div class="flex items-center">
<span class="w-[160px] flex-shrink-0 text-[#64748B] font-label-sm text-label-sm">Other person</span>
<div class="w-[200px] h-[16px] bg-[#E0E7FF] hover:bg-[#C7D2FE] rounded-[4px] cursor-pointer transition-colors relative group">
<div class="absolute inset-0 bg-[#4F46E5]/10 rounded-[4px]"></div>
</div>
</div>
<!-- Department -->
<div class="flex items-center">
<span class="w-[160px] flex-shrink-0 text-[#64748B] font-label-sm text-label-sm">Department</span>
<div class="w-[140px] h-[16px] bg-[#E2E8F0] rounded-[4px] animate-pulse"></div>
</div>
<!-- Year -->
<div class="flex items-center">
<span class="w-[160px] flex-shrink-0 text-[#64748B] font-label-sm text-label-sm">Year</span>
<div class="w-[80px] h-[16px] bg-[#E2E8F0] rounded-[4px] animate-pulse"></div>
</div>
<!-- Your role -->
<div class="flex items-center">
<span class="w-[160px] flex-shrink-0 text-[#64748B] font-label-sm text-label-sm">Your role</span>
<div class="w-[80px] h-[16px] bg-[#E2E8F0] rounded-[4px] animate-pulse"></div>
</div>
<!-- Requested on -->
<div class="flex items-center">
<span class="w-[160px] flex-shrink-0 text-[#64748B] font-label-sm text-label-sm">Requested on</span>
<div class="w-[80px] h-[16px] bg-[#E2E8F0] rounded-[4px] animate-pulse"></div>
</div>
</div>
</div>
<!-- Card 2: Proposed slot -->
<div class="bg-white rounded-[12px] p-[24px] shadow-[0_1px_2px_rgba(15,23,42,0.06)] border border-[#E2E8F0]">
<h3 class="font-headline-sm text-headline-sm text-[#0F172A] mb-[20px]">Proposed slot</h3>
<div class="flex flex-col gap-[16px]">
<!-- Date and time -->
<div class="flex items-center">
<span class="w-[160px] flex-shrink-0 text-[#64748B] font-label-sm text-label-sm">Date and time</span>
<div class="w-[140px] h-[16px] bg-[#E2E8F0] rounded-[4px] animate-pulse"></div>
</div>
<!-- Duration -->
<div class="flex items-center">
<span class="w-[160px] flex-shrink-0 text-[#64748B] font-label-sm text-label-sm">Duration</span>
<div class="w-[80px] h-[16px] bg-[#E2E8F0] rounded-[4px] animate-pulse"></div>
</div>
<!-- Mode -->
<div class="flex items-center">
<span class="w-[160px] flex-shrink-0 text-[#64748B] font-label-sm text-label-sm">Mode</span>
<div class="w-[80px] h-[16px] bg-[#E2E8F0] rounded-[4px] animate-pulse"></div>
</div>
<!-- Location -->
<div class="flex items-center">
<span class="w-[160px] flex-shrink-0 text-[#64748B] font-label-sm text-label-sm">Location</span>
<div class="w-[140px] h-[16px] bg-[#E2E8F0] rounded-[4px] animate-pulse"></div>
</div>
<!-- Meeting link -->
<div class="flex items-center">
<span class="w-[160px] flex-shrink-0 text-[#64748B] font-label-sm text-label-sm">Meeting link</span>
<div class="w-[200px] h-[16px] bg-[#E2E8F0] rounded-[4px] animate-pulse"></div>
</div>
<!-- Cancellation deadline -->
<div class="flex items-center">
<span class="w-[160px] flex-shrink-0 text-[#64748B] font-label-sm text-label-sm">Cancellation deadline</span>
<div class="w-[140px] h-[16px] bg-[#E2E8F0] rounded-[4px] animate-pulse"></div>
</div>
</div>
</div>
</div>
<!-- Right Column: Fills the rest (approx 448px) -->
<div class="w-full lg:flex-1">
<!-- Card: Actions -->
<div class="bg-white rounded-[12px] p-[24px] shadow-[0_1px_2px_rgba(15,23,42,0.06)] border border-[#E2E8F0]">
<h3 class="font-headline-sm text-headline-sm text-[#0F172A] mb-[20px]">Actions</h3>
<div class="flex flex-col gap-[8px]">
<!-- Primary: Agree to slot -->
<button class="w-full h-[40px] bg-[#4F46E5] hover:bg-[#4338CA] active:bg-[#3730A3] text-[#FFFFFF] rounded-[8px] font-label-md text-label-md font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-[#E0E7FF]" type="button">
                Agree to slot
              </button>
<!-- Secondary: Decline slot -->
<button class="w-full h-[40px] bg-[#FFFFFF] hover:bg-[#F8FAFC] active:bg-[#F1F5F9] border border-[#CBD5E1] text-[#0F172A] rounded-[8px] font-label-md text-label-md font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-[#E0E7FF]" type="button">
                Decline slot
              </button>
<!-- Danger: Cancel request -->
<button class="w-full h-[40px] bg-[#DC2626] hover:bg-[#B91C1C] active:bg-[#991B1B] text-[#FFFFFF] rounded-[8px] font-label-md text-label-md font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-[#FEE2E2]" type="button">
                Cancel request
              </button>
</div>
</div>
</div>
</div>
</div>
</div>
</div>
<script>
  // Ensure the Requests nav item has active styling matching the shell mandate
  document.addEventListener("DOMContentLoaded", () => {
    const navLinks = document.querySelectorAll('header nav a');
    navLinks.forEach(link => {
      if (link.getAttribute('data-path') === 'requests') {
        link.className = "h-full flex items-center font-label-md text-label-md text-primary border-b-2 border-primary";
      } else {
        link.className = "h-full flex items-center font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors";
      }
    });
  });
</script></main></body></html>
