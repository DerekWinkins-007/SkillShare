ackdrop-blur-sm"><main class="w-full max-w-[1440px] flex items-center justify-center"><div class="flex flex-col w-full items-center justify-center p-gutter min-h-[720px]">
<!-- Dialog Modal Container (Width 480px) -->
<div class="w-full max-w-[480px] bg-surface-container-lowest rounded-xl p-space-lg shadow-xl flex flex-col gap-space-md relative transition-all duration-200">
<!-- Modal Header -->
<div class="flex items-center justify-between pb-space-xs">
<div class="flex items-center gap-space-xs">
<span class="material-symbols-outlined text-primary text-[22px]">calendar_add_on</span>
<h3 class="font-headline-sm text-headline-sm text-on-surface">Propose a slot</h3>
</div>
<button aria-label="Close dialog" class="w-8 h-8 rounded-lg flex items-center justify-center text-secondary hover:bg-surface-container hover:text-on-surface transition-colors cursor-pointer" type="button">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-space-md" onsubmit="event.preventDefault()">
<!-- Field 1: Date and time -->
<div class="flex flex-col gap-space-2xs">
<label class="font-label-md text-label-md text-secondary flex items-center gap-space-2xs" for="slot-datetime">
          Date and time <span class="text-tertiary font-bold">*</span>
</label>
<div class="relative w-full">
<input class="w-full h-10 px-space-sm bg-surface-container-lowest rounded-xl text-on-surface font-body-md text-body-md placeholder-secondary/50 shadow-sm focus:outline-none focus:bg-surface-container-lowest transition-all hover:bg-surface-container-low" id="slot-datetime" placeholder="Select date and time" type="datetime-local"/>
</div>
<p class="font-body-sm text-body-sm text-secondary flex items-center gap-1 mt-0.5">
<span class="material-symbols-outlined text-[14px]">info</span>
          Must be at least 2 hours from now.
        </p>
</div>
<!-- Field 2: Duration -->
<div class="flex flex-col gap-space-2xs">
<label class="font-label-md text-label-md text-secondary flex items-center gap-space-2xs" for="slot-duration">
          Duration <span class="text-tertiary font-bold">*</span>
</label>
<div class="relative w-full">
<select class="w-full h-10 px-space-sm pr-9 bg-surface-container-lowest rounded-xl text-on-surface font-body-md text-body-md appearance-none shadow-sm focus:outline-none focus:bg-surface-container-lowest transition-all hover:bg-surface-container-low cursor-pointer" id="slot-duration">
<option disabled="" selected="" value="">Select duration</option>
<option value="15">15 minutes</option>
<option value="30">30 minutes</option>
<option value="45">45 minutes</option>
<option value="60">60 minutes (1 hour)</option>
<option value="90">90 minutes</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-space-sm text-secondary">
<span class="material-symbols-outlined text-[20px]">expand_more</span>
</div>
</div>
</div>
<!-- Field 3: Mode -->
<div class="flex flex-col gap-space-2xs">
<label class="font-label-md text-label-md text-secondary flex items-center gap-space-2xs">
          Mode <span class="text-tertiary font-bold">*</span>
</label>
<div class="flex items-center gap-space-lg pt-1">
<!-- Online Radio Option (Selected) -->
<label class="flex items-center gap-space-xs cursor-pointer select-none group">
<div class="relative flex items-center justify-center">
<input checked="" class="peer sr-only" id="mode-online" name="session-mode" type="radio" value="online"/>
<div class="w-4 h-4 rounded-full bg-surface-container-lowest shadow-sm peer-checked:bg-primary flex items-center justify-center transition-all group-hover:scale-105">
<div class="w-1.5 h-1.5 rounded-full bg-surface-container-lowest"></div>
</div>
</div>
<span class="font-body-md text-body-md text-on-surface flex items-center gap-1">
<span class="material-symbols-outlined text-[16px] text-primary">videocam</span>
              Online
            </span>
</label>
<!-- Offline Radio Option (Unselected) -->
<label class="flex items-center gap-space-xs cursor-pointer select-none group">
<div class="relative flex items-center justify-center">
<input class="peer sr-only" id="mode-offline" name="session-mode" type="radio" value="offline"/>
<div class="w-4 h-4 rounded-full bg-surface-container-high peer-checked:bg-primary flex items-center justify-center transition-all group-hover:bg-surface-variant">
<div class="w-1.5 h-1.5 rounded-full bg-surface-container-lowest hidden peer-checked:block"></div>
</div>
</div>
<span class="font-body-md text-body-md text-secondary group-hover:text-on-surface flex items-center gap-1 transition-colors">
<span class="material-symbols-outlined text-[16px]">location_on</span>
              Offline
            </span>
</label>
</div>
</div>
<!-- Field 4: Meeting link (Optional) -->
<div class="flex flex-col gap-space-2xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-secondary" for="meeting-link">
            Meeting link
          </label>
<span class="font-label-xs text-label-xs text-secondary/70">Optional</span>
</div>
<div class="relative w-full">
<input class="w-full h-10 px-space-sm bg-surface-container-lowest rounded-xl text-on-surface font-body-md text-body-md placeholder-secondary/50 shadow-sm focus:outline-none focus:bg-surface-container-lowest transition-all hover:bg-surface-container-low" id="meeting-link" maxlength="200" oninput="document.getElementById('link-counter').textContent = this.value.length + '/200'" placeholder="https://zoom.us/j/... or Google Meet URL" type="url"/>
</div>
<div class="flex justify-end pt-0.5">
<span class="font-label-xs text-label-xs text-secondary" id="link-counter">0/200</span>
</div>
</div>
<!-- Dialog Footer Action Row -->
<div class="flex items-center justify-end gap-space-xs pt-space-xs mt-space-2xs">
<button class="h-10 px-space-md rounded-xl bg-surface-container-low hover:bg-surface-container text-on-surface font-label-md text-label-md shadow-sm transition-all cursor-pointer flex items-center justify-center active:scale-[0.98]" type="button">
          Cancel
        </button>
<button class="h-10 px-space-md rounded-xl bg-primary hover:bg-primary/90 text-on-primary font-label-md text-label-md shadow-md transition-all cursor-pointer flex items-center gap-space-2xs active:scale-[0.98]" type="submit">
<span class="material-symbols-outlined text-[18px]">send</span>
          Send proposal
        </button>
</div>
</form>
</div>
</div></main></div></body></html>
