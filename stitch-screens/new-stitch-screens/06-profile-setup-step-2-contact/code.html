-md text-secondary hover:bg-surface-container-low hover:text-on-surface rounded-lg transition-colors" data-path="login" href="#">Sign out</a></div></div></header><main class="w-full pt-16 bg-surface min-h-[calc(100vh-64px)] flex items-center justify-center"><div class="flex flex-col w-full">
<div class="w-full max-w-[640px] mx-auto py-space-xl px-margin flex flex-col gap-space-lg">
<!-- Header Context -->
<div class="flex flex-col gap-space-md">
<h1 class="font-headline-lg text-headline-lg text-on-surface font-bold tracking-tight">Set up your profile</h1>
<!-- Step Indicator -->
<div class="grid grid-cols-3 gap-space-xs pt-space-xs">
<!-- Step 1 -->
<div class="flex flex-col gap-space-2xs">
<div class="h-1 w-full bg-surface-container-high rounded-full"></div>
<span class="font-label-sm text-label-sm text-secondary font-medium">1 Basics</span>
</div>
<!-- Step 2 (Active) -->
<div class="flex flex-col gap-space-2xs">
<div class="h-1 w-full bg-primary-container rounded-full"></div>
<span class="font-label-sm text-label-sm text-primary-container font-semibold">2 Contact</span>
</div>
<!-- Step 3 -->
<div class="flex flex-col gap-space-2xs">
<div class="h-1 w-full bg-surface-container-high rounded-full"></div>
<span class="font-label-sm text-label-sm text-secondary font-medium">3 Skills</span>
</div>
</div>
</div>

<div class="bg-surface-container-lowest rounded-full p-space-lg shadow-sm flex flex-col gap-space-lg">

<div class="flex flex-col gap-space-2xs">
<h3 class="font-headline-md text-headline-md text-on-surface font-semibold">Contact details</h3>
<p class="font-body-sm text-body-sm text-secondary">These details are shared with the other person only after a request is confirmed.</p>
</div>
<!-- Form Fields -->
<form class="flex flex-col gap-space-md" onsubmit="event.preventDefault();">
<!-- Phone 1 -->
<div class="flex flex-col gap-space-2xs">
<label class="font-label-md text-label-md text-on-surface" for="phone-1">Phone 1 <span class="text-tertiary">*</span></label>
<input class="h-10 px-space-sm bg-surface-container-lowest text-body-md font-body-md text-on-surface rounded-xl outline outline-1 outline-outline-variant focus:outline-2 focus:outline-primary-container transition-all" id="phone-1" name="phone-1" required="" type="tel"/>
<span class="font-body-sm text-body-sm text-secondary">10 digits, optional +91 prefix.</span>
</div>
<!-- Phone 2 -->
<div class="flex flex-col gap-space-2xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="phone-2">Phone 2</label>
<span class="font-label-xs text-label-xs text-secondary">(optional)</span>
</div>
<input class="h-10 px-space-sm bg-surface-container-lowest text-body-md font-body-md text-on-surface rounded-xl outline outline-1 outline-outline-variant focus:outline-2 focus:outline-primary-container transition-all" id="phone-2" name="phone-2" type="tel"/>
<span class="font-body-sm text-body-sm text-secondary">10 digits, optional +91 prefix.</span>
</div>
<!-- Email 1 -->
<div class="flex flex-col gap-space-2xs">
<label class="font-label-md text-label-md text-on-surface" for="email-1">Email 1 <span class="text-tertiary">*</span></label>
<input class="h-10 px-space-sm bg-surface-container-lowest text-body-md font-body-md text-on-surface rounded-xl outline outline-1 outline-outline-variant focus:outline-2 focus:outline-primary-container transition-all" id="email-1" name="email-1" required="" type="email"/>
</div>

<div class="flex flex-col gap-space-2xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="email-2">Email 2</label>
<span class="font-label-xs text-label-xs text-secondary">(optional)</span>
</div>
<input class="h-10 px-space-sm bg-surface-container-lowest text-body-md font-body-md text-on-surface rounded-xl outline outline-1 outline-outline-variant focus:outline-2 focus:outline-primary-container transition-all" id="email-2" name="email-2" type="email"/>
</div>

<div class="flex items-center justify-end gap-space-xs pt-space-xs">
