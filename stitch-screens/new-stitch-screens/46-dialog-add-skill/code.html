ackdrop-blur-sm"><main class="w-full max-w-[1440px] flex items-center justify-center"><div class="flex flex-col w-full items-center justify-center min-h-[640px] relative py-space-2xl">
<!-- Subtle decorative ambient backing behind modal for depth -->
<div class="absolute -top-12 -left-12 w-96 h-96 bg-primary-fixed/30 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-16 -right-16 w-96 h-96 bg-secondary-container/40 rounded-full blur-3xl pointer-events-none"></div>
<!-- Form Dialog Component -->
<div class="relative w-full max-w-[480px] bg-surface-container-lowest rounded-full p-space-lg shadow-xl shadow-on-surface/15 flex flex-col gap-space-lg animate-in fade-in zoom-in-95 duration-200">
<!-- Header Row -->
<div class="flex items-center justify-between pb-space-xs">
<div class="flex items-center gap-space-xs">
<span class="w-1.5 h-4 bg-primary rounded-DEFAULT"></span>
<h3 class="font-headline-md text-headline-md text-on-surface">Add skill</h3>
</div>
<button aria-label="Close dialog" class="w-8 h-8 rounded-lg flex items-center justify-center text-secondary hover:text-on-surface hover:bg-surface-container transition-colors focus:outline-none focus:bg-surface-container" id="btn-close-dialog" type="button">
<span class="material-symbols-outlined text-[20px] leading-none">close</span>
</button>
</div>
<!-- Dialog Body / Form Fields -->
<form class="flex flex-col gap-space-md" id="add-skill-form" onsubmit="event.preventDefault();">
<!-- Field 1: Skill Name -->
<div class="flex flex-col gap-space-2xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface-variant select-none" for="skill-name">
            Skill name <span class="text-tertiary">*</span>
</label>
</div>
<div class="relative w-full">
<input autocomplete="off" class="w-full h-10 px-space-sm bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-xl outline outline-1 outline-outline-variant focus:outline-2 focus:outline-primary placeholder:text-outline transition-all" id="skill-name" maxlength="30" name="skillName" placeholder="e.g. Distributed Systems Architecture" type="text"/>
</div>
<div class="flex justify-end pt-space-2xs">
<span class="font-body-sm text-body-sm text-secondary font-code-sm" id="char-counter">0/30</span>
</div>
</div>
<!-- Field 2: Category Select Dropdown -->
<div class="flex flex-col gap-space-2xs">
<label class="font-label-md text-label-md text-on-surface-variant select-none" for="skill-category">
          Category <span class="text-tertiary">*</span>
</label>
<div class="relative w-full">
<select class="w-full h-10 pl-space-sm pr-10 bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-xl outline outline-1 outline-outline-variant focus:outline-2 focus:outline-primary transition-all appearance-none cursor-pointer" id="skill-category" name="category">
<option class="text-outline" disabled="" selected="" value="">Select category</option>
<option class="text-on-surface" value="cloud-computing">Systems &amp; Architecture</option>
<option class="text-on-surface" value="software-engineering">Software Engineering</option>
<option class="text-on-surface" value="data-analytics">Data &amp; Machine Learning</option>
<option class="text-on-surface" value="product-design">UI/UX Systems Engineering</option>
<option class="text-on-surface" value="security">Security &amp; Compliance</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-space-sm text-secondary">
<span class="material-symbols-outlined text-[20px]">expand_more</span>
</div>
</div>
</div>
<!-- Contextual Meta / Tip Strip -->
<div class="mt-space-2xs p-space-sm bg-surface-container-low rounded-xl flex items-start gap-space-sm">
<span class="material-symbols-outlined text-[18px] text-primary shrink-0 mt-0.5">verified</span>
<div class="flex flex-col">
<span class="font-label-xs text-label-xs text-primary uppercase tracking-wider">Curriculum Alignment</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Skills map directly into your progressive competency matrix and peer-reviewed code labs.</span>
</div>
</div>
<!-- Footer Buttons -->
<div class="flex items-center justify-end gap-space-xs pt-space-sm mt-space-2xs">
<button class="h-10 px-space-lg bg-surface-container-lowest text-on-surface font-label-md text-label-md rounded-xl outline outline-1 outline-outline-variant hover:bg-surface-container-low hover:outline-secondary active:bg-surface-container transition-all" id="btn-cancel" type="button">
          Cancel
        </button>
<button class="h-10 px-space-lg bg-primary text-on-primary font-label-md text-label-md rounded-xl hover:bg-primary/95 active:bg-on-primary-fixed-variant transition-all shadow-sm flex items-center gap-space-xs" id="btn-submit" type="submit">
<span>Add skill</span>
<span class="material-symbols-outlined text-[18px] leading-none">arrow_forward</span>
</button>
</div>
</form>
</div>
</div>
<script>
  (function initAddSkillDialog() {
    const input = document.getElementById('skill-name');
    const counter = document.getElementById('char-counter');
    const cancelBtn = document.getElementById('btn-cancel');
    const closeBtn = document.getElementById('btn-close-dialog');
    const form = document.getElementById('add-skill-form');

    if (input && counter) {
      input.addEventListener('input', function() {
        const length = this.value.length;
        counter.textContent = length + '/30';
        if (length >= 30) {
          counter.classList.add('text-tertiary');
          counter.classList.remove('text-secondary');
        } else {
          counter.classList.remove('text-tertiary');
          counter.classList.add('text-secondary');
        }
      });
    }

    function resetForm() {
      if (form) form.reset();
      if (counter) {
        counter.textContent = '0/30';
        counter.classList.remove('text-tertiary');
        counter.classList.add('text-secondary');
      }
    }

    if (cancelBtn) cancelBtn.addEventListener('click', resetForm);
    if (closeBtn) closeBtn.addEventListener('click', resetForm);
  })();
</script></main></div></body></html>
