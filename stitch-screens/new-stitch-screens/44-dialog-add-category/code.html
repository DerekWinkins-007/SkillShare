 "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, "spacing": { "space-2xl": "48px", "margin-wide": "32px", "margin": "24px", "gutter-wide": "24px", "space-xl": "32px", "gutter": "16px", "space-2xs": "4px", "space-lg": "24px", "space-md": "16px", "space-sm": "12px", "space-xs": "8px" }, "fontFamily": { "label-xs": ["Inter"], "headline-sm": ["Inter"], "body-sm": ["Inter"], "body-md": ["Inter"], "headline-md": ["Inter"], "code-md": ["JetBrains Mono"], "display-lg": ["Inter"], "body-lg": ["Inter"], "label-sm": ["Inter"], "code-sm": ["JetBrains Mono"], "headline-lg": ["Inter"], "label-md": ["Inter"] }, "fontSize": { "label-xs": ["11px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "600" }], "headline-sm": ["16px", { "lineHeight": "24px", "letterSpacing": "-0.005em", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.005em", "fontWeight": "400" }], "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "code-md": ["13px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }], "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400" }], "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500" }], "code-sm": ["11px", { "lineHeight": "16px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "500" }] } } } };</script></head><body class="bg-surface min-h-screen font-body-md text-body-md text-on-surface antialiased"><div class="min-h-[1024px] w-full flex items-center justify-center p-margin bg-inverse-surface/50 backdrop-blur-sm"><main class="w-full max-w-[1440px] flex items-center justify-center"><div class="flex flex-col w-full items-center justify-center min-h-[720px] p-space-md">
<div class="w-full max-w-[480px] bg-surface-container-lowest rounded-xl p-space-lg shadow-xl flex flex-col gap-space-lg transition-all duration-200">
<!-- Header Row -->
<div class="flex items-center justify-between pb-space-xs">
<h3 class="font-headline-md text-headline-md text-on-surface tracking-tight">Add category</h3>
<button aria-label="Close dialog" class="w-8 h-8 rounded-lg flex items-center justify-center text-secondary hover:text-on-surface hover:bg-surface-container transition-colors focus:outline-none" id="close-dialog-btn" type="button">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Content Form -->
<form class="flex flex-col gap-space-xs" id="category-form" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-space-2xs">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-space-2xs" for="category-name-input">
<span>Category name</span>
<span aria-hidden="true" class="text-tertiary font-bold">*</span>
</label>
<div class="relative w-full">
<input autofocus="" class="w-full h-10 px-space-sm bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-xl outline outline-1 outline-outline-variant focus:outline-2 focus:outline-primary placeholder:text-outline transition-all" id="category-name-input" maxlength="30" placeholder="e.g. System Architecture" type="text"/>
</div>
<!-- Counter below input, right-aligned -->
<div class="flex justify-end pt-space-2xs">
<span class="font-body-sm text-body-sm text-secondary tabular-nums" id="char-counter">
            0/30
          </span>
</div>
</div>
<!-- Quick Preset Selection Chips -->
<div class="flex flex-col gap-space-2xs pt-space-xs">
<span class="font-label-xs text-label-xs text-secondary uppercase tracking-wider">Suggested taxonomies</span>
<div class="flex flex-wrap gap-space-2xs">
<button class="preset-chip px-space-xs py-space-2xs rounded-lg bg-surface-container hover:bg-surface-container-high text-on-surface font-label-xs text-label-xs transition-colors" data-value="Engineering Design" type="button">
            + Engineering Design
          </button>
<button class="preset-chip px-space-xs py-space-2xs rounded-lg bg-surface-container hover:bg-surface-container-high text-on-surface font-label-xs text-label-xs transition-colors" data-value="Core Frameworks" type="button">
            + Core Frameworks
          </button>
<button class="preset-chip px-space-xs py-space-2xs rounded-lg bg-surface-container hover:bg-surface-container-high text-on-surface font-label-xs text-label-xs transition-colors" data-value="Advanced DevOps" type="button">
            + Advanced DevOps
          </button>
</div>
</div>
<!-- Footer Action Row -->
<div class="flex items-center justify-end gap-space-xs pt-space-md">
<button class="h-10 px-space-md rounded-xl bg-surface-container-lowest text-on-surface font-label-md text-label-md outline outline-1 outline-outline-variant hover:bg-surface-container-low transition-colors focus:outline-2 focus:outline-primary" id="cancel-btn" type="button">
          Cancel
        </button>
<button class="h-10 px-space-md rounded-xl bg-primary text-on-primary font-label-md text-label-md hover:bg-primary-container transition-colors focus:outline-2 focus:outline-primary-fixed shadow-sm flex items-center justify-center gap-space-xs cursor-pointer" id="submit-btn" type="submit">
<span>Add category</span>
</button>
</div>
</form>
</div>
</div>
<script>
  (function() {
    const input = document.getElementById('category-name-input');
    const counter = document.getElementById('char-counter');
    const submitBtn = document.getElementById('submit-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const closeBtn = document.getElementById('close-dialog-btn');
    const presetChips = document.querySelectorAll('.preset-chip');

    function updateCounter() {
      if (!input || !counter) return;
      const count = input.value.length;
      counter.textContent = `${count}/30`;
      
      if (count > 25) {
        counter.classList.add('text-tertiary');
        counter.classList.remove('text-secondary');
      } else {
        counter.classList.remove('text-tertiary');
        counter.classList.add('text-secondary');
      }
    }

    if (input) {
      input.addEventListener('input', updateCounter);
    }

    presetChips.forEach(chip => {
      chip.addEventListener('click', () => {
        const value = chip.getAttribute('data-value');
        if (input && value) {
          input.value = value.substring(0, 30);
          updateCounter();
          input.focus();
        }
      });
    });

    const resetDialog = () => {
      if (input) {
        input.value = '';
        updateCounter();
        input.focus();
      }
    };

    if (cancelBtn) cancelBtn.addEventListener('click', resetDialog);
    if (closeBtn) closeBtn.addEventListener('click', resetDialog);
  })();
</script></main></div></body></html>
