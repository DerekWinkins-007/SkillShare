<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_standard" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

etween"><div class="flex items-center gap-space-xl h-full"><a class="text-[20px] leading-[28px] font-bold text-primary tracking-tight select-none" data-path="dashboard" href="#">SkillShare</a><nav class="flex items-center gap-space-lg h-full" data-active-classes="text-primary border-b-2 border-primary font-label-md"><a class="h-full flex items-center font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors" data-path="dashboard" href="#">Dashboard</a><a class="h-full flex items-center font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors" data-path="catalogue" href="#">Catalogue</a><a aria-current="page" class="h-full flex items-center transition-colors text-primary border-b-2 border-primary font-label-md" data-path="requests" href="#">Requests</a><a class="h-full flex items-center font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors" data-path="proposals" href="#">Proposals</a><a class="h-full flex items-center font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors" data-path="reports" href="#">Reports</a></nav></div><div class="flex items-center gap-space-md"><button aria-label="Notifications" class="relative flex items-center justify-center w-9 h-9 rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container-low transition-colors" type="button"><span class="material-symbols-outlined text-[20px]">notifications</span><span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-error ring-2 ring-surface-container-lowest"></span></button><button class="flex items-center gap-space-2xs px-space-sm h-9 rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container-low transition-colors font-label-md text-label-md" type="button"><span class="font-label-md text-label-md">Account</span><span class="material-symbols-outlined text-[18px]">expand_more</span></button><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="w-full pt-16 min-h-screen bg-background"><div class="max-w-[1200px] mx-auto px-margin"><div class="flex flex-col w-full py-space-xl">
<!-- Back Link -->
<div class="mb-space-md">
<a class="inline-flex items-center gap-space-2xs text-secondary hover:text-on-surface transition-colors font-label-md text-label-md" href="/requests">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
<span>Requests</span>
</a>
</div>
<!-- Header Row -->
<div class="flex items-center gap-space-md mb-space-lg">
<!-- H1 Skeleton Title -->
<div aria-hidden="true" class="h-8 w-[200px] bg-surface-container-high rounded-lg animate-pulse"></div>
<!-- Status Badge "Pending" -->
<span class="inline-flex items-center justify-center h-6 px-2.5 rounded-full bg-[#FEF3C7] text-[#B45309] font-label-sm text-label-sm font-medium tracking-wide">
      Pending
    </span>
</div>
<!-- Two-column Layout -->
<div class="flex flex-col lg:flex-row gap-gutter-wide items-start">
<!-- Left Column (720px fixed on desktop) -->
<div class="w-full lg:w-[720px] flex-shrink-0">
<div class="bg-surface-container-lowest rounded-xl p-space-lg shadow-sm">
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-space-md font-semibold">
          Summary
        </h3>
<!-- Label / Value Rows -->
<div class="flex flex-col gap-space-sm">
<!-- Skill -->
<div class="flex items-center">
<span class="w-[160px] flex-shrink-0 font-label-sm text-label-sm text-secondary">Skill</span>
<div aria-hidden="true" class="h-4 w-[140px] bg-surface-container-high rounded animate-pulse"></div>
</div>
<!-- Category -->
<div class="flex items-center">
<span class="w-[160px] flex-shrink-0 font-label-sm text-label-sm text-secondary">Category</span>
<div aria-hidden="true" class="h-4 w-[140px] bg-surface-container-high rounded animate-pulse"></div>
</div>
<!-- Other person -->
<div class="flex items-center">
<span class="w-[160px] flex-shrink-0 font-label-sm text-label-sm text-secondary">Other person</span>
<a aria-label="View student profile" class="inline-block group" href="/students/:studentid">
<div aria-hidden="true" class="h-4 w-[200px] bg-surface-container-high rounded group-hover:bg-primary-fixed-dim transition-colors animate-pulse"></div>
</a>
</div>
<!-- Department -->
<div class="flex items-center">
<span class="w-[160px] flex-shrink-0 font-label-sm text-label-sm text-secondary">Department</span>
<div aria-hidden="true" class="h-4 w-[140px] bg-surface-container-high rounded animate-pulse"></div>
</div>
<!-- Year -->
<div class="flex items-center">
<span class="w-[160px] flex-shrink-0 font-label-sm text-label-sm text-secondary">Year</span>
<div aria-hidden="true" class="h-4 w-[80px] bg-surface-container-high rounded animate-pulse"></div>
</div>
<!-- Your role -->
<div class="flex items-center">
<span class="w-[160px] flex-shrink-0 font-label-sm text-label-sm text-secondary">Your role</span>
<div aria-hidden="true" class="h-4 w-[80px] bg-surface-container-high rounded animate-pulse"></div>
</div>
<!-- Requested on -->
<div class="flex items-center">
<span class="w-[160px] flex-shrink-0 font-label-sm text-label-sm text-secondary">Requested on</span>
<div aria-hidden="true" class="h-4 w-[80px] bg-surface-container-high rounded animate-pulse"></div>
</div>
</div>
</div>
</div>
<!-- Right Column (fills rest) -->
<div class="w-full flex-grow">
<div class="bg-surface-container-lowest rounded-xl p-space-lg shadow-sm">
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-space-md font-semibold">
          Actions
        </h3>
<!-- Danger Button Stacked Full Width -->
<button class="w-full h-10 bg-error hover:bg-[#B91C1C] text-on-error font-label-md text-label-md font-medium rounded-xl flex items-center justify-center transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-error-container" type="button">
          Withdraw request
        </button>
</div>
</div>
</div>
</div></div></main></body></html>
