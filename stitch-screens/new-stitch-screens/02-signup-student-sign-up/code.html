e-container-low hover:text-on-surface rounded-lg transition-colors" data-path="login" href="#">Sign out</a></div></div></header><main class="w-full pt-16 bg-surface min-h-[calc(100vh-64px)] flex items-center justify-center"><div class="flex flex-col w-full items-center justify-center p-space-md">
<!-- Wordmark 48px above card -->
<div class="mb-space-2xl text-center">
<span class="font-display-lg text-display-lg font-bold text-primary-container tracking-tight">SkillShare</span>
</div>
<!-- Student Sign Up Card -->
<div class="w-full max-w-[440px] bg-surface-container-lowest border border-outline-variant rounded-full p-space-xl shadow-sm">
<h1 class="font-display-lg text-display-lg text-on-surface mb-space-xl text-center tracking-tight">
      Create student account
    </h1>
<form class="flex flex-col gap-space-lg" onsubmit="event.preventDefault();">
<!-- Registration Number -->
<div class="flex flex-col gap-space-2xs">
<label class="font-label-md text-label-md text-on-surface" for="reg-number">
          Registration number <span class="text-error font-bold">*</span>
</label>
<input class="h-10 w-full rounded-lg border border-outline-variant bg-surface-container-lowest px-space-sm font-body-md text-body-md text-on-surface placeholder-secondary focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary-fixed transition-all" id="reg-number" placeholder="" required="" type="text"/>
<span class="font-body-sm text-body-sm text-secondary">
          Format: 2 digits, 3 letters, 4 digits.
        </span>
</div>
<!-- Email -->
<div class="flex flex-col gap-space-2xs">
<label class="font-label-md text-label-md text-on-surface" for="email">
          Email <span class="text-error font-bold">*</span>
</label>
<input class="h-10 w-full rounded-lg border border-outline-variant bg-surface-container-lowest px-space-sm font-body-md text-body-md text-on-surface placeholder-secondary focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary-fixed transition-all" id="email" placeholder="" required="" type="email"/>
</div>
<!-- Password -->
<div class="flex flex-col gap-space-2xs">
<label class="font-label-md text-label-md text-on-surface" for="password">
          Password <span class="text-error font-bold">*</span>
</label>
<input class="h-10 w-full rounded-lg border border-outline-variant bg-surface-container-lowest px-space-sm font-body-md text-body-md text-on-surface placeholder-secondary focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary-fixed transition-all" id="password" placeholder="" required="" type="password"/>
<span class="font-body-sm text-body-sm text-secondary">
          At least 8 characters, with a letter and a number.
        </span>
</div>
<!-- Re-enter Password -->
<div class="flex flex-col gap-space-2xs">
<label class="font-label-md text-label-md text-on-surface" for="confirm-password">
          Re-enter password <span class="text-error font-bold">*</span>
</label>
<input class="h-10 w-full rounded-lg border border-outline-variant bg-surface-container-lowest px-space-sm font-body-md text-body-md text-on-surface placeholder-secondary focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary-fixed transition-all" id="confirm-password" placeholder="" required="" type="password"/>
</div>
<!-- Submit Button -->
<button class="w-full h-10 mt-space-xs bg-primary-container hover:bg-primary text-on-primary font-label-md text-label-md rounded-lg transition-colors flex items-center justify-center cursor-pointer focus:outline-none focus:ring-2 focus:ring-primary-fixed" type="submit">
        Create account
      </button>
</form>
<!-- Already have an account row -->
<div class="mt-space-lg text-center font-body-sm text-body-sm text-secondary">
      Already have an account? <a class="text-primary-container font-label-sm hover:underline transition-all" data-path="login" href="#">Sign in</a>
</div>
</div>
</div></main></body></html>
