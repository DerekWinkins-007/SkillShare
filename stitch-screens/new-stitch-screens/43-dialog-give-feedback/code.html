 "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, "spacing": { "space-2xl": "48px", "margin-wide": "32px", "margin": "24px", "gutter-wide": "24px", "space-xl": "32px", "gutter": "16px", "space-2xs": "4px", "space-lg": "24px", "space-md": "16px", "space-sm": "12px", "space-xs": "8px" }, "fontFamily": { "label-xs": ["Inter"], "headline-sm": ["Inter"], "body-sm": ["Inter"], "body-md": ["Inter"], "headline-md": ["Inter"], "code-md": ["JetBrains Mono"], "display-lg": ["Inter"], "body-lg": ["Inter"], "label-sm": ["Inter"], "code-sm": ["JetBrains Mono"], "headline-lg": ["Inter"], "label-md": ["Inter"] }, "fontSize": { "label-xs": ["11px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "600" }], "headline-sm": ["16px", { "lineHeight": "24px", "letterSpacing": "-0.005em", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.005em", "fontWeight": "400" }], "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "code-md": ["13px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }], "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400" }], "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500" }], "code-sm": ["11px", { "lineHeight": "16px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "500" }] } } } };</script></head><body class="bg-surface min-h-screen font-body-md text-body-md text-on-surface antialiased"><div class="min-h-[1024px] w-full flex items-center justify-center p-margin bg-inverse-surface/50 backdrop-blur-sm"><main class="w-full max-w-[1440px] flex items-center justify-center"><div class="flex flex-col w-full items-center justify-center p-space-lg">
<div class="relative w-full max-w-[480px] bg-surface-container-lowest rounded-xl p-space-lg shadow-2xl flex flex-col gap-space-lg">
<div class="flex items-center justify-between w-full">
<h3 class="font-headline-md text-headline-md text-on-surface tracking-tight">Give feedback</h3>
<button aria-label="Close dialog" class="w-8 h-8 flex items-center justify-center rounded-lg text-secondary hover:text-on-surface hover:bg-surface-container-high transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<form class="flex flex-col gap-space-md" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface flex items-center gap-space-2xs">
          Rating <span class="text-error font-body-md">*</span>
</label>
<div aria-label="Rating from 1 to 5 stars" class="flex items-center gap-space-2xs py-1" id="star-rating" role="radiogroup">
<button aria-checked="false" aria-label="1 Star" class="star-btn transition-transform hover:scale-110 focus:outline-none" data-value="1" role="radio" type="button">
<span class="material-symbols-outlined text-[20px] text-outline-variant select-none">star</span>
</button>
<button aria-checked="false" aria-label="2 Stars" class="star-btn transition-transform hover:scale-110 focus:outline-none" data-value="2" role="radio" type="button">
<span class="material-symbols-outlined text-[20px] text-outline-variant select-none">star</span>
</button>
<button aria-checked="false" aria-label="3 Stars" class="star-btn transition-transform hover:scale-110 focus:outline-none" data-value="3" role="radio" type="button">
<span class="material-symbols-outlined text-[20px] text-outline-variant select-none">star</span>
</button>
<button aria-checked="false" aria-label="4 Stars" class="star-btn transition-transform hover:scale-110 focus:outline-none" data-value="4" role="radio" type="button">
<span class="material-symbols-outlined text-[20px] text-outline-variant select-none">star</span>
</button>
<button aria-checked="false" aria-label="5 Stars" class="star-btn transition-transform hover:scale-110 focus:outline-none" data-value="5" role="radio" type="button">
<span class="material-symbols-outlined text-[20px] text-outline-variant select-none">star</span>
</button>
</div>
</div>
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface" for="feedback-comment">
          Comment
        </label>
<div class="relative w-full">
<textarea class="w-full min-h-[96px] p-space-sm font-body-md text-body-md text-on-surface bg-surface-container-lowest rounded-xl outline outline-1 outline-outline-variant focus:outline-primary focus:outline-2 placeholder:text-outline transition-all resize-none" id="feedback-comment" maxlength="100" placeholder="Tell us about your experience..."></textarea>
</div>
<div class="flex justify-end">
<span class="font-body-sm text-body-sm text-secondary" id="char-counter">0/100</span>
</div>
</div>
<div class="flex items-center justify-end gap-space-xs pt-space-xs">
<button class="h-10 px-space-md rounded-xl bg-surface-container-lowest outline outline-1 outline-outline-variant hover:bg-surface-container-low text-on-surface font-label-md text-label-md transition-colors" type="button">
          Later
        </button>
<button class="h-10 px-space-md rounded-xl bg-primary-container hover:bg-primary text-on-primary font-label-md text-label-md transition-colors shadow-sm" type="submit">
          Submit feedback
        </button>
</div>
</form>
</div>
<script>
    (function() {
      const textarea = document.getElementById('feedback-comment');
      const counter = document.getElementById('char-counter');
      if (textarea && counter) {
        textarea.addEventListener('input', () => {
          const count = textarea.value.length;
          counter.textContent = `${count}/100`;
        });
      }

      const stars = document.querySelectorAll('.star-btn');
      let currentRating = 0;

      function renderStars(rating, isHover = false) {
        stars.forEach((btn, index) => {
          const icon = btn.querySelector('.material-symbols-outlined');
          const value = index + 1;
          if (value <= rating) {
            icon.classList.remove('text-outline-variant');
            icon.classList.add('text-primary-container');
            icon.style.fontVariationSettings = "'FILL' 1";
          } else {
            icon.classList.remove('text-primary-container');
            icon.classList.add('text-outline-variant');
            icon.style.fontVariationSettings = "'FILL' 0";
          }
        });
      }

      stars.forEach((btn) => {
        btn.addEventListener('mouseenter', () => {
          const val = parseInt(btn.getAttribute('data-value'), 10);
          renderStars(val, true);
        });

        btn.addEventListener('mouseleave', () => {
          renderStars(currentRating);
        });

        btn.addEventListener('click', () => {
          const val = parseInt(btn.getAttribute('data-value'), 10);
          currentRating = val;
          stars.forEach((s, idx) => {
            s.setAttribute('aria-checked', (idx + 1 === currentRating).toString());
          });
          renderStars(currentRating);
        });
      });
    })();
  </script>
</div></main></div></body></html>
