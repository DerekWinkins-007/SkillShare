<!DOCTYPE html>

<html class="h-full" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base { html, body { margin: 0; padding: 0; } body { overscroll-behavior: none; } main > :first-child { margin-top: 0 !important; } main > :last-child { margin-bottom: 0 !important; } } ::-webkit-scrollbar { display: none; }</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-variant": "#dae2fd", "on-surface-variant": "#464555", "inverse-on-surface": "#eef0ff", "on-secondary-container": "#54647a", "primary-container": "#4f46e5", "surface-container": "#eaedff", "tertiary-fixed-dim": "#ffb4ab", "background": "#faf8ff", "surface-container-lowest": "#ffffff", "tertiary-fixed": "#ffdad6", "secondary": "#505f76", "on-secondary-fixed-variant": "#38485d", "tertiary": "#97000c", "error-container": "#ffdad6", "on-secondary-fixed": "#0b1c30", "on-tertiary-fixed": "#410002", "secondary-fixed-dim": "#b7c8e1", "on-tertiary-container": "#ffd1cc", "surface-tint": "#4d44e3", "on-primary-fixed": "#0f0069", "on-tertiary-fixed-variant": "#93000b", "surface-dim": "#d2d9f4", "on-error-container": "#93000a", "surface-container-high": "#e2e7ff", "secondary-fixed": "#d3e4fe", "tertiary-container": "#c20b17", "inverse-primary": "#c3c0ff", "error": "#ba1a1a", "on-secondary": "#ffffff", "primary-fixed": "#e2dfff", "primary-fixed-dim": "#c3c0ff", "on-surface": "#131b2e", "on-tertiary": "#ffffff", "surface-bright": "#faf8ff", "primary": "#3525cd", "inverse-surface": "#283044", "surface": "#faf8ff", "on-primary": "#ffffff", "surface-container-low": "#f2f3ff", "outline": "#777587", "surface-container-highest": "#dae2fd", "secondary-container": "#d0e1fb", "on-error": "#ffffff", "on-primary-container": "#dad7ff", "on-background": "#131b2e", "outline-variant": "#c7c4d8", "on-primary-fixed-variant": "#3323cc" }, "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, "spacing": { "space-2xl": "48px", "margin-wide": "32px", "margin": "24px", "gutter-wide": "24px", "space-xl": "32px", "gutter": "16px", "space-2xs": "4px", "space-lg": "24px", "space-md": "16px", "space-sm": "12px", "space-xs": "8px" }, "fontFamily": { "label-xs": ["Inter"], "headline-sm": ["Inter"], "body-sm": ["Inter"], "body-md": ["Inter"], "headline-md": ["Inter"], "code-md": ["JetBrains Mono"], "display-lg": ["Inter"], "body-lg": ["Inter"], "label-sm": ["Inter"], "code-sm": ["JetBrains Mono"], "headline-lg": ["Inter"], "label-md": ["Inter"] }, "fontSize": { "label-xs": ["11px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "600" }], "headline-sm": ["16px", { "lineHeight": "24px", "letterSpacing": "-0.005em", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.005em", "fontWeight": "400" }], "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "code-md": ["13px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }], "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400" }], "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500" }], "code-sm": ["11px", { "lineHeight": "16px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "500" }] } } } };</script></head><body class="bg-surface min-h-screen font-body-md text-body-md text-on-surface antialiased"><div class="min-h-[1024px] w-full flex items-center justify-center p-margin bg-inverse-surface/50 backdrop-blur-sm"><main class="w-full max-w-[1440px] flex items-center justify-center"><div class="flex flex-col w-full items-center justify-center min-h-[720px] relative select-none">
<!-- Backdrop Canvas Emulation (integrated smoothly within app shell context) -->
<div class="fixed inset-0 bg-[#0F172A]/50 backdrop-blur-[2px] transition-opacity duration-200 pointer-events-none z-0"></div>
<!-- Dialog Window: 480px structural card -->
<div aria-labelledby="dialog-title" aria-modal="true" class="relative z-10 w-full max-w-[480px] bg-surface-container-lowest rounded-2xl p-space-lg shadow-[0_12px_32px_rgba(15,23,42,0.18)] flex flex-col gap-space-lg transition-transform duration-200 transform scale-100" id="cancel-request-dialog" role="dialog">
<!-- Header Block -->
<div class="flex flex-col gap-space-2xs">
<div class="flex items-center justify-between">
<h3 class="text-[18px] leading-[26px] font-semibold text-[#0F172A] tracking-[-0.01em]" id="dialog-title">
          Cancel request
        </h3>
<button aria-label="Close dialog" class="w-8 h-8 -mr-1.5 flex items-center justify-center rounded-lg text-[#64748B] hover:text-[#0F172A] hover:bg-surface-container transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-primary/20" onclick="dismissDialog()" type="button">
<span class="material-symbols-outlined text-[20px] leading-none">close</span>
</button>
</div>
<p class="font-body-md text-body-md text-[#64748B] pr-space-md">
        You can cancel until one hour before the meeting. The other person will be notified.
      </p>
</div>
<!-- Reason Field Section -->
<div class="flex flex-col gap-space-xs">
<label class="text-[14px] leading-[20px] font-medium text-[#334155] flex items-center gap-1" for="cancel-reason-input">
        Reason <span aria-hidden="true" class="text-tertiary font-medium">*</span>
</label>
<div class="relative w-full">
<textarea class="w-full min-h-[96px] resize-y bg-surface-container-lowest rounded-lg p-space-sm text-[14px] leading-[20px] text-[#0F172A] placeholder:text-[#94A3B8] shadow-sm transition-all duration-150 outline-none focus:ring-2 focus:ring-primary focus:border-transparent" id="cancel-reason-input" maxlength="200" name="cancel_reason" oninput="handleReasonInput(this)" placeholder="Please state why you are cancelling..." rows="4" style="border: 1px solid #CBD5E1;"></textarea>
</div>
<div class="flex justify-end">
<span class="font-body-sm text-body-sm text-[#64748B] tabular-nums" id="reason-counter">0/200</span>
</div>
</div>
<!-- Action Footer -->
<div class="flex items-center justify-end gap-space-xs pt-space-xs">
<button class="h-[40px] px-space-md rounded-lg font-medium text-[14px] leading-[20px] text-[#0F172A] bg-surface-container-lowest hover:bg-[#F8FAFC] active:bg-[#F1F5F9] transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-secondary/20 shadow-sm" onclick="dismissDialog()" style="border: 1px solid #CBD5E1;" type="button">
        Keep request
      </button>
<button class="h-[40px] px-space-md rounded-lg font-medium text-[14px] leading-[20px] text-white bg-[#DC2626] hover:bg-[#B91C1C] active:bg-[#991B1B] transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-[#DC2626]/40 shadow-sm flex items-center justify-center gap-1.5" id="confirm-cancel-btn" onclick="confirmCancellation()" type="button">
<span>Cancel request</span>
</button>
</div>
</div>
</div>
<script>
  function handleReasonInput(textarea) {
    const counter = document.getElementById('reason-counter');
    if (counter) {
      counter.textContent = `${textarea.value.length}/200`;
    }
  }

  function dismissDialog() {
    const dialog = document.getElementById('cancel-request-dialog');
    if (dialog) {
      dialog.classList.add('opacity-0', 'scale-95');
      setTimeout(() => {
        dialog.parentElement.style.display = 'none';
      }, 150);
    }
  }

  function confirmCancellation() {
    const textarea = document.getElementById('cancel-reason-input');
    const confirmBtn = document.getElementById('confirm-cancel-btn');
    
    if (textarea && textarea.value.trim().length === 0) {
      textarea.style.borderColor = '#DC2626';
      textarea.focus();
      return;
    }
    
    if (confirmBtn) {
      confirmBtn.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span><span>Processing...</span>';
      confirmBtn.disabled = true;
      setTimeout(() => {
        dismissDialog();
      }, 600);
    }
  }
</script></main></div></body></html>
