<html class="h-full" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base { html, body { margin: 0; padding: 0; } body { overscroll-behavior: none; } main > :first-child { margin-top: 0 !important; } main > :last-child { margin-bottom: 0 !important; } } ::-webkit-scrollbar { display: none; }</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-variant": "#dae2fd", "on-surface-variant": "#464555", "inverse-on-surface": "#eef0ff", "on-secondary-container": "#54647a", "primary-container": "#4f46e5", "surface-container": "#eaedff", "tertiary-fixed-dim": "#ffb4ab", "background": "#faf8ff", "surface-container-lowest": "#ffffff", "tertiary-fixed": "#ffdad6", "secondary": "#505f76", "on-secondary-fixed-variant": "#38485d", "tertiary": "#97000c", "error-container": "#ffdad6", "on-secondary-fixed": "#0b1c30", "on-tertiary-fixed": "#410002", "secondary-fixed-dim": "#b7c8e1", "on-tertiary-container": "#ffd1cc", "surface-tint": "#4d44e3", "on-primary-fixed": "#0f0069", "on-tertiary-fixed-variant": "#93000b", "surface-dim": "#d2d9f4", "on-error-container": "#93000a", "surface-container-high": "#e2e7ff", "secondary-fixed": "#d3e4fe", "tertiary-container": "#c20b17", "inverse-primary": "#c3c0ff", "error": "#ba1a1a", "on-secondary": "#ffffff", "primary-fixed": "#e2dfff", "primary-fixed-dim": "#c3c0ff", "on-surface": "#131b2e", "on-tertiary": "#ffffff", "surface-bright": "#faf8ff", "primary": "#3525cd", "inverse-surface": "#283044", "surface": "#faf8ff", "on-primary": "#ffffff", "surface-container-low": "#f2f3ff", "outline": "#777587", "surface-container-highest": "#dae2fd", "secondary-container": "#d0e1fb", "on-error": "#ffffff", "on-primary-container": "#dad7ff", "on-background": "#131b2e", "outline-variant": "#c7c4d8", "on-primary-fixed-variant": "#3323cc" }, "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, "spacing": { "space-2xl": "48px", "margin-wide": "32px", "margin": "24px", "gutter-wide": "24px", "space-xl": "32px", "gutter": "16px", "space-2xs": "4px", "space-lg": "24px", "space-md": "16px", "space-sm": "12px", "space-xs": "8px" }, "fontFamily": { "label-xs": ["Inter"], "headline-sm": ["Inter"], "body-sm": ["Inter"], "body-md": ["Inter"], "headline-md": ["Inter"], "code-md": ["JetBrains Mono"], "display-lg": ["Inter"], "body-lg": ["Inter"], "label-sm": ["Inter"], "code-sm": ["JetBrains Mono"], "headline-lg": ["Inter"], "label-md": ["Inter"] }, "fontSize": { "label-xs": ["11px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "600" }], "headline-sm": ["16px", { "lineHeight": "24px", "letterSpacing": "-0.005em", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.005em", "fontWeight": "400" }], "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "code-md": ["13px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }], "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400" }], "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500" }], "code-sm": ["11px", { "lineHeight": "16px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "500" }] } } } };</script></head><body class="bg-surface min-h-screen font-body-md text-body-md text-on-surface antialiased"><div class="min-h-[1024px] w-full flex items-center justify-center p-margin bg-inverse-surface/50 backdrop-blur-sm"><main class="w-full max-w-[1440px] flex items-center justify-center"><div class="flex flex-col w-full items-center justify-center min-h-[720px] relative select-none">
<!-- Interactive Modal Container -->
<dialog class="m-0 p-0 bg-transparent border-0 max-w-none w-full flex items-center justify-center backdrop:bg-transparent" id="propose-skill-modal" open="">
<div class="w-[480px] bg-surface-container-lowest rounded-[16px] border border-[#E2E8F0] p-margin flex flex-col gap-space-md shadow-[0_12px_32px_rgba(15,23,42,0.18)] text-on-surface">
<!-- Header -->
<div class="flex items-start justify-between gap-space-sm">
<div class="flex flex-col">
<h3 class="font-headline-md text-headline-md font-semibold text-[#0F172A] leading-[26px]">
            Propose a new skill
          </h3>
<p class="font-body-md text-body-md text-[#64748B] mt-space-2xs">
            Admins review every proposal.
          </p>
</div>
<button aria-label="Close dialog" class="text-[#64748B] hover:text-[#0F172A] hover:bg-surface-container-low transition-colors rounded-[8px] p-space-2xs -mr-space-2xs -mt-space-2xs flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-primary/20" id="close-modal-btn" type="button">
<span class="material-symbols-outlined text-[20px] leading-none">close</span>
</button>
</div>
<!-- Form Content -->
<form class="flex flex-col gap-space-md" id="propose-skill-form" onsubmit="event.preventDefault();">
<!-- Field 1: Skill Name -->
<div class="flex flex-col">
<label class="font-label-md text-label-md text-[#0F172A] mb-space-xs font-medium flex items-center gap-space-2xs" for="skill-name-input">
<span>Skill name</span>
<span aria-hidden="true" class="text-error font-medium">*</span>
</label>
<input class="h-[40px] w-full px-space-sm bg-surface-container-lowest border border-[#CBD5E1] rounded-[8px] font-body-md text-body-md text-[#0F172A] placeholder:text-[#94A3B8] focus:border-primary focus:outline-none focus:ring-2 focus:ring-[#E0E7FF] transition-all" id="skill-name-input" maxlength="30" placeholder="e.g. Distributed Tracing" required="" type="text"/>
<div class="flex justify-end mt-space-2xs">
<span class="font-label-sm text-label-sm text-[#64748B]" id="skill-name-counter">0/30</span>
</div>
</div>
<!-- Field 2: Category Select -->
<div class="flex flex-col">
<label class="font-label-md text-label-md text-[#0F172A] mb-space-xs font-medium flex items-center gap-space-2xs" for="category-select">
<span>Category</span>
<span aria-hidden="true" class="text-error font-medium">*</span>
</label>
<div class="relative w-full">
<select class="h-[40px] w-full pl-space-sm pr-space-xl bg-surface-container-lowest border border-[#CBD5E1] rounded-[8px] font-body-md text-body-md text-[#0F172A] appearance-none focus:border-primary focus:outline-none focus:ring-2 focus:ring-[#E0E7FF] transition-all cursor-pointer invalid:text-[#94A3B8]" id="category-select" required="">
<option disabled="" hidden="" selected="" value="">Select a domain category</option>
<option class="text-[#0F172A]" value="systems">Backend &amp; Systems Architecture</option>
<option class="text-[#0F172A]" value="frontend">Frontend &amp; Interface Engineering</option>
<option class="text-[#0F172A]" value="infra">Cloud Infrastructure &amp; SRE</option>
<option class="text-[#0F172A]" value="data">Data Pipeline &amp; Analytics</option>
<option class="text-[#0F172A]" value="ml">Machine Learning Systems</option>
<option class="text-[#0F172A]" value="security">Application Security</option>
</select>
<div class="absolute inset-y-0 right-0 flex items-center pr-space-sm pointer-events-none text-[#64748B]">
<span class="material-symbols-outlined text-[20px]">expand_more</span>
</div>
</div>
</div>
<!-- Field 3: Reason Textarea -->
<div class="flex flex-col">
<label class="font-label-md text-label-md text-[#0F172A] mb-space-xs font-medium" for="reason-input">
            Reason
          </label>
<textarea class="min-h-[96px] w-full p-space-sm bg-surface-container-lowest border border-[#CBD5E1] rounded-[8px] font-body-md text-body-md text-[#0F172A] placeholder:text-[#94A3B8] resize-none focus:border-primary focus:outline-none focus:ring-2 focus:ring-[#E0E7FF] transition-all" id="reason-input" maxlength="200" placeholder="Explain why this skill is needed in the catalog..." rows="3"></textarea>
<div class="flex justify-end mt-space-2xs">
<span class="font-label-sm text-label-sm text-[#64748B]" id="reason-counter">0/200</span>
</div>
</div>
<!-- Action Buttons -->
<div class="flex items-center justify-end gap-space-xs pt-space-xs">
<button class="h-[40px] px-space-md rounded-[8px] border border-[#CBD5E1] bg-surface-container-lowest text-[#334155] font-label-md text-label-md hover:bg-surface-container-low hover:border-[#94A3B8] hover:text-[#0F172A] active:bg-surface-container transition-colors focus:outline-none focus:ring-2 focus:ring-[#E0E7FF]" id="cancel-btn" type="button">
            Cancel
          </button>
<button class="h-[40px] px-space-md rounded-[8px] bg-[#4F46E5] text-on-primary font-label-md text-label-md hover:bg-[#4338CA] active:bg-[#3730A3] transition-colors focus:outline-none focus:ring-2 focus:ring-[#E0E7FF] shadow-sm flex items-center justify-center font-medium" id="submit-btn" type="submit">
            Submit proposal
          </button>
</div>
</form>
</div>
</dialog>
</div>
<script>
  (function() {
    const nameInput = document.getElementById('skill-name-input');
    const nameCounter = document.getElementById('skill-name-counter');
    const reasonInput = document.getElementById('reason-input');
    const reasonCounter = document.getElementById('reason-counter');
    const form = document.getElementById('propose-skill-form');
    const cancelBtn = document.getElementById('cancel-btn');
    const closeBtn = document.getElementById('close-modal-btn');
    const categorySelect = document.getElementById('category-select');

    if (nameInput && nameCounter) {
      nameInput.addEventListener('input', () => {
        nameCounter.textContent = `${nameInput.value.length}/30`;
      });
    }

    if (reasonInput && reasonCounter) {
      reasonInput.addEventListener('input', () => {
        reasonCounter.textContent = `${reasonInput.value.length}/200`;
      });
    }

    const resetForm = () => {
      form.reset();
      if (nameCounter) nameCounter.textContent = '0/30';
      if (reasonCounter) reasonCounter.textContent = '0/200';
    };

    if (cancelBtn) {
      cancelBtn.addEventListener('click', resetForm);
    }

    if (closeBtn) {
      closeBtn.addEventListener('click', resetForm);
    }
  })();
</script></main></div></body></html>
